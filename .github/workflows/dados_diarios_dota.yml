# Robô DIÁRIO do Gabinete Dota (24/07): busca as partidas novas na OpenDota,
# regenera os CSVs e retreina o modelo — sozinho, todo dia.
#
# Por que existe: sem ele o modelo envelhece calado. Medido em 16/08 o Dota
# estava com dados de 09/07 (38 dias parado) porque o sync só rodava à mão no
# PC. A OpenDota é API de verdade (ao contrário do Oracle's Elixir do LoL, cuja
# quota do Google Drive bloqueia download automático) — aqui dá pra automatizar.
#
# A nuvem (Streamlit) NUNCA treina: ela só puxa do git o que este robô commitar.
name: Dados diários (OpenDota)

on:
  schedule:
    - cron: "40 10 * * *"   # ~07:40 BRT
    - cron: "40 22 * * *"   # ~19:40 BRT (2ª janela: se a cota travar de manhã)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dados-diarios-dota
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # +19min quando o cache de identidade da API vence (semanal)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install --quiet -r requirements.txt

      - name: Sync OpenDota (partidas novas + backfill)
        env:
          # Opcional: sem a chave o script usa o tier grátis (foi assim em 16/08,
          # levou 15 min). Com a chave, mais cota. Configure em Settings >
          # Secrets and variables > Actions, se quiser.
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: python daily_sync.py

      # FOTOS POR MINUTO para a aba "Durante o mapa (estado -> vitoria)", que
      # NUNCA funcionou no Dota por falta desse dado (achado 16/08/2026). Sao
      # ~23 mil partidas contra cota de ~2k/dia: colhe um pedaco por rodada,
      # e retomavel, e em ~2 semanas a base fica completa sozinha.
      # continue-on-error: cota estourada nao pode derrubar o resto da esteira.
      - name: Coletar serie por minuto (um pedaco por rodada)
        continue-on-error: true
        timeout-minutes: 25
        run: python opendota_timeline_sync.py --budget-seconds 1200 --max-matches 1500

      - name: Regenerar CSVs no schema OracleElixir-like
        run: python dota_adapter.py

      - name: Retreinar o modelo
        run: |
          python -m mlcore.train_offline \
            --out ml_artifact.json \
            --holdout-days 30 \
            --csv CSV_HISTORICO/2025_Dota_match_data_oe_like.csv \
            --csv CSV_DIARIO/2026_Dota_match_data_oe_like.csv

      # O train_offline ajusta os ratings só até o corte do holdout. Como esta
      # esteira retreina do ZERO todo dia, sem este passo o modelo publicado
      # ficaria PERMANENTEMENTE 30 dias atrasado (achado 16/08/2026: Iron Wing
      # tinha 16 jogos em 2026 e games_played=0). O robô do LoL nunca sofreu
      # disso porque lá o passo diário é justamente o incremental.
      - name: Aplicar os jogos recentes (fechar a defasagem do holdout)
        run: |
          python -m mlcore.update_incremental \
            --artifact ml_artifact.json \
            --csv CSV_DIARIO/2026_Dota_match_data_oe_like.csv

      - name: Guarda — o artifact carrega e prevê? (nunca publicar quebrado)
        run: |
          python - <<'PY'
          import sys
          from mlcore.artifact import MLArtifact
          art = MLArtifact.load_json("ml_artifact.json")
          r = getattr(art.model, "ratings", {}) or {}
          if len(r) < 100:
              print(f"GUARDA FALHOU: só {len(r)} times no artifact"); sys.exit(1)
          teams = list(r)[:2]
          p = float(art.model.p_blue(teams[0], teams[1]))
          if not (0.0 < p < 1.0):
              print(f"GUARDA FALHOU: p_blue inválido ({p})"); sys.exit(1)
          print(f"guarda ok: {len(r)} times, p_blue={p:.3f}")
          PY

      - name: Commitar dados e modelo
        run: |
          git config user.name "Robo Gabinete Dota"
          git config user.email "robo@gabinete.local"
          git add data.csv CSV_DIARIO CSV_HISTORICO CSV_DOTA ml_artifact.json team_api_cache.json league_tiers.csv timeline_snapshots.csv
          if git diff --cached --quiet; then
            echo "nada novo hoje — sem commit"
          else
            git commit -m "Robô: dados e modelo do Dota atualizados"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push recusado (concorrência) — rebase e retry $i/3"
              git pull --rebase || exit 1
            done
            git push
          fi
