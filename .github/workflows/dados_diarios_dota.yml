# Robô DIÁRIO do Gabinete Dota (24/07): busca as partidas novas na OpenDota,
# regenera os CSVs e retreina o modelo — sozinho, todo dia.
#
# Por que existe: sem ele o modelo envelhece calado. Medido em 16/08 o Dota
# estava com dados de 09/07 (38 dias parado) porque o sync só rodava à mão no
# PC. A OpenDota é API de verdade (ao contrário do Oracle's Elixir do LoL, cuja
# quota do Google Drive bloqueia download automático) — aqui dá pra automatizar.
#
# A nuvem (Streamlit) NUNCA treina: ela só puxa do git o que este robô commitar.
name: Dados diários (OpenDota)

on:
  schedule:
    - cron: "40 10 * * *"   # ~07:40 BRT
    - cron: "40 22 * * *"   # ~19:40 BRT (2ª janela: se a cota travar de manhã)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: dados-diarios-dota
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # +19min quando o cache de identidade da API vence (semanal)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install --quiet -r requirements.txt

      - name: Sync OpenDota (partidas novas + backfill)
        env:
          # Opcional: sem a chave o script usa o tier grátis (foi assim em 16/08,
          # levou 15 min). Com a chave, mais cota. Configure em Settings >
          # Secrets and variables > Actions, se quiser.
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: python daily_sync.py

      # FOTOS POR MINUTO para a aba "Durante o mapa (estado -> vitoria)", que
      # NUNCA funcionou no Dota por falta desse dado (achado 16/08/2026). Sao
      # ~23 mil partidas contra cota de ~2k/dia: colhe um pedaco por rodada,
      # e retomavel, e em ~2 semanas a base fica completa sozinha.
      # continue-on-error: cota estourada nao pode derrubar o resto da esteira.
      - name: Coletar serie por minuto (um pedaco por rodada)
        continue-on-error: true
        timeout-minutes: 25
        run: python opendota_timeline_sync.py --budget-seconds 1200 --max-matches 1500

      # ELENCOS POR TEAM_ID (27/10/2026): o raw_matches.jsonl do robo so tem as
      # partidas do dia e nao vai para o git -- sem isto a uniao de ids pelo
      # elenco (mesmo time com dois team_id, ex. PARIVISION) nao rodava aqui.
      # Soma os jogadores do dia ao arquivo versionado ANTES do adapter ler.
      - name: Atualizar elencos por time (identidade)
        run: python tools/atualizar_elencos_dota.py

      - name: Regenerar CSVs no schema OracleElixir-like
        run: python dota_adapter.py

      # CONTRATO DE DADOS (22/10/2026): CSV quebrado nao treina. Sai != 0 se
      # falhar; o job para antes do treino e o modelo publicado fica o antigo.
      - name: Contrato de dados (CSV do adaptador pode treinar?)
        run: python tools/contrato_dados_dota.py

      - name: Retreinar o modelo
        run: |
          python -m mlcore.train_offline \
            --out ml_artifact.json \
            --holdout-days 30 \
            --csv CSV_HISTORICO/2025_Dota_match_data_oe_like.csv \
            --csv CSV_DIARIO/2026_Dota_match_data_oe_like.csv

      # O train_offline ajusta os ratings só até o corte do holdout. Como esta
      # esteira retreina do ZERO todo dia, sem este passo o modelo publicado
      # ficaria PERMANENTEMENTE 30 dias atrasado (achado 16/08/2026: Iron Wing
      # tinha 16 jogos em 2026 e games_played=0). O robô do LoL nunca sofreu
      # disso porque lá o passo diário é justamente o incremental.
      - name: Aplicar os jogos recentes (fechar a defasagem do holdout)
        run: |
          python -m mlcore.update_incremental \
            --artifact ml_artifact.json \
            --csv CSV_DIARIO/2026_Dota_match_data_oe_like.csv

      - name: Guarda — o artifact carrega e prevê? (nunca publicar quebrado)
        run: |
          python - <<'PY'
          import sys
          from mlcore.artifact import MLArtifact
          art = MLArtifact.load_json("ml_artifact.json")
          r = getattr(art.model, "ratings", {}) or {}
          if len(r) < 100:
              print(f"GUARDA FALHOU: só {len(r)} times no artifact"); sys.exit(1)
          teams = list(r)[:2]
          p = float(art.model.p_blue(teams[0], teams[1]))
          if not (0.0 < p < 1.0):
              print(f"GUARDA FALHOU: p_blue inválido ({p})"); sys.exit(1)
          print(f"guarda ok: {len(r)} times, p_blue={p:.3f}")
          PY

      # A tela mostra a nota/ECE do torneio antes de ele apostar. Sem regenerar
      # aqui, esse aviso congela no dia em que foi gerado a mao e vira mentira
      # com cara de medicao. continue-on-error: a nota nao pode derrubar a
      # esteira de dados.
      - name: Recalcular a nota por torneio (o aviso da tela)
        id: nota
        continue-on-error: true
        run: python dota_scorecard.py

      # GUARDAS POS-RETREINO -- QUALIDADE ANTES DE PUBLICAR (22/10/2026). A guarda
      # acima so confere que o modelo carrega e preve. Esta confere se ele esta
      # BOM: a nota recem-medida contra a publicada (pior que moeda, queda >
      # 0,020 ou jogos medidos caindo >10% reprovam). Reprovou: os DADOS saem,
      # o MODELO anterior fica no ar (passo de commit abaixo). Ver a ferramenta.
      - name: Guardas pós-retreino (qualidade antes de publicar o modelo)
        id: portao
        continue-on-error: true
        run: |
          if [ "${{ steps.nota.outcome }}" = "success" ]; then
            python tools/portao_qualidade_dota.py
          else
            python tools/portao_qualidade_dota.py --nao-medida
          fi

      # CANARIO (23/10/2026): o modelo novo preve parecido com o que esta no ar,
      # nos mesmos jogos? Barrou: igual a trava acima, os dados saem e o modelo
      # anterior fica. Tetos medidos no historico do git (ver a ferramenta).
      - name: Canario (modelo novo x modelo no ar)
        id: canario
        continue-on-error: true
        run: python tools/canario_modelo.py

      # LIVRO-CAIXA DO SILENCIO: lista o que esta sendo tolerado, com IDADE.
      # NAO bloqueia (severidade em camadas: derrubar a esteira de DADO por
      # questao de contabilidade seria absurdo). Aqui ele so reporta e grava;
      # a escalada por idade e do vigia semanal, que abre issue.
      - name: Livro-caixa do silencio (so reporta)
        continue-on-error: true
        run: python livro_caixa.py

      # Frescor e regua das 28: ambas so REPORTAM. Regua que so roda quando
      # alguem roda vale metade (ML Test Score, criterio de pontuacao), e a
      # do Dota nao rodava em lugar nenhum — a nota que eu lia era de quando?
      - name: Frescor das reguas (so reporta)
        continue-on-error: true
        run: python frescor.py

      - name: Regua das 28 (so reporta)
        continue-on-error: true
        run: python regua_28.py 2>&1 | tee regua_out.txt


      # A regua faz a nota cair sozinha quando uma declaracao vence (90 dias).
      # Sem isto seria decadencia CALADA — o proprio defeito que ela ataca —,
      # porque este repo nao tinha nenhum workflow que avisasse ninguem.
      - name: Escalar declaracao vencida (abre issue)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q -e "declaracao(oes) VENCIDA" -e "declaracoes RECUSADAS" regua_out.txt || exit 0
          quais=$(grep -A 6 -e "VENCIDA(s) ou sem data" -e "RECUSADAS" regua_out.txt | tr -s " \n" ' ' | head -c 400)
          export CORPO="Alguma declaracao da regua das 28 passou dos 90 dias (ou nao vale neste repo). Ela conta ZERO ate alguem reverificar, entao a nota da regua caiu sozinha sem nada ter mudado no sistema - de proposito, carimbo que ninguem confere e decoracao. Itens: $quais Reverificar e atualizar evidence/regua_28_declaracoes.json."
          python -c "import json,os,sys; open('issue.json','w').write(json.dumps({'title':'Regua das 28: declaracao vencida','body':os.environ['CORPO']}))"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @issue.json

      - name: Commitar dados e modelo
        run: |
          git config user.name "Robo Gabinete Dota"
          git config user.email "robo@gabinete.local"
          if [ "${{ steps.canario.outcome }}" != "success" ]; then
            echo "::warning::Canario BARROU: o modelo novo mudou demais as previsoes; os dados saem, o modelo publicado continua o anterior."
            git checkout HEAD -- ml_artifact.json
          fi
          if [ "${{ steps.portao.outcome }}" != "success" ]; then
            echo "::warning::Trava de qualidade REPROVOU: os dados saem, o modelo publicado continua o anterior."
            git checkout HEAD -- ml_artifact.json
          fi
          git add data.csv CSV_DIARIO CSV_HISTORICO CSV_DOTA ml_artifact.json team_api_cache.json league_tiers.csv timeline_snapshots.csv elencos_times_dota.json evidence
          git add -f evidence/contrato_dados_dota.json
          if git diff --cached --quiet; then
            echo "nada novo hoje — sem commit"
          else
            git commit -m "Robô: dados e modelo do Dota atualizados"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push recusado (concorrência) — rebase e retry $i/3"
              git pull --rebase --autostash || exit 1
            done
            git push
          fi
